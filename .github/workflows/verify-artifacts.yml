name: Verify release artifacts

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  artifact:
    name: Verify ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: artifacts-build-local-aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-apple-darwin
            artifact: artifacts-build-local-x86_64-apple-darwin
            runner: macos-26-intel
          - target: aarch64-unknown-linux-musl
            artifact: artifacts-build-local-aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            artifact: artifacts-build-local-x86_64-unknown-linux-musl
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: artifacts
      - name: Verify archive
        shell: bash
        env:
          PLAN: ${{ inputs.plan }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version=$(jq -r '.releases[0].app_version' <<<"$PLAN")
          archive=$(find artifacts -name "shed-$TARGET.tar.gz" -type f -print -quit)
          checksum=$(find artifacts -name "shed-$TARGET.tar.gz.sha256" -type f -print -quit)
          test -n "$archive"
          test -n "$checksum"

          expected=$(awk '{print $1}' "$checksum")
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$archive" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "$archive" | awk '{print $1}')
          fi
          test "$actual" = "$expected"

          mkdir unpacked
          tar -xzf "$archive" -C unpacked
          binary=$(find unpacked -type f -name shed -print -quit)
          test -n "$binary"
          chmod +x "$binary"
          test "$("$binary" --version)" = "shed $version"
          "$binary" --help >/dev/null

          if [[ "$TARGET" == *-linux-musl ]]; then
            if readelf -l "$binary" | grep -q 'Requesting program interpreter'; then
              echo "$TARGET unexpectedly has a dynamic ELF interpreter" >&2
              exit 1
            fi
            linkage=$(ldd "$binary" 2>&1 || true)
            grep -Eq 'statically linked|not a dynamic executable' <<<"$linkage"
          fi

  nix:
    name: Build Nix package (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Build and smoke-test
        run: nix flake check --print-build-logs
      - name: Export runtime closure
        shell: bash
        run: |
          set -euo pipefail
          nix build --print-build-logs --out-link result
          output=$(readlink -f result)
          printf '%s\n' "$output" > output-path
          # Export only the runtime closure; build-time Rust dependencies remain in cache.nixos.org.
          mapfile -t closure < <(nix-store -qR "$output")
          nix-store --export "${closure[@]}" | gzip -9 > closure.nar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nix-closure-${{ matrix.system }}
          path: |
            closure.nar.gz
            output-path
          retention-days: 7
