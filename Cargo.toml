[package]
name = "shed"
version = "0.4.0"
edition = "2024"
description = "Sync dotfiles between system paths and a local shed"
license = "MIT"
repository = "https://github.com/deemson/shed"
homepage = "https://github.com/deemson/shed"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "scrolling-regions"] }
schemars = { version = "1.0.0-alpha.22", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "macros"] }
tokio-util = "0.7"
futures = "0.3"
async-walkdir = "2"
yaml_serde = "0.10"
iradix = "0.3.0"
shellexpand = { version = "3", default-features = false, features = ["base-0", "path", "tilde"] }
path-clean = "1.0.1"
colored = "3.1.1"

[dev-dependencies]
indoc = "2.0.7"
pretty_assertions = "1.4.1"
tempfile = "3"

[profile.release]
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
