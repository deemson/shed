[package]
name = "shed"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "scrolling-regions"] }
schemars = { version = "1.0.0-alpha.22", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir = "2.5"
yaml_serde = "0.10"

[dev-dependencies]
tempfile = "3"
